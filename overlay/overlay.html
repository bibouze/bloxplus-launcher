<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; background: transparent; font-family: "Segoe UI Variable", "Segoe UI", sans-serif; overflow: hidden; }
  .pill {
    margin: 6px; padding: 10px 14px; border-radius: 14px; color: #fff;
    background: rgba(12, 14, 22, 0.78); border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex; align-items: center; gap: 12px; backdrop-filter: blur(8px);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; flex: none; }
  .time { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sub { font-size: 11px; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
</style>
</head>
<body>
  <div class="pill">
    <span class="dot"></span>
    <div>
      <div class="time" id="time">0:00</div>
      <div class="sub" id="sub">Session Roblox</div>
    </div>
  </div>
<script>
  const fmt = (s) => {
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
  };
  window.bp.on('overlay:update', (st) => {
    document.getElementById('time').textContent = fmt(st.sessionSeconds);
    const today = Math.round((st.today || 0) / 60);
    document.getElementById('sub').textContent = (st.current?.name || 'Session Roblox') + ` · ${today} min aujourd'hui`;
  });
</script>
</body>
</html>
