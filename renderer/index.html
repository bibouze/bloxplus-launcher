<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.rbxcdn.com; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>BloxPlus Launcher</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="titlebar">
    <div class="brand">
      <span class="logo"></span>
      <span class="brand-name">Blox<b>Plus</b></span>
      <span class="brand-tag">Launcher</span>
    </div>
    <div class="titlebar-center" id="session-pill" hidden></div>
    <div class="win-buttons">
      <button data-win="minimize" title="Réduire"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="maximize" title="Agrandir"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
      <button data-win="close" class="close" title="Fermer"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div id="profile-mini"></div>
      </div>
    </aside>
    <main id="view"></main>
  </div>

  <div id="roblox-progress" class="card" hidden></div>
  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script src="js/core.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/games.js"></script>
  <script src="js/views/friends.js"></script>
  <script src="js/views/admins.js"></script>
  <script src="js/views/fflags.js"></script>
  <script src="js/views/optimize.js"></script>
  <script src="js/views/shaders.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
